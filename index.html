<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Promoters</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#020617;color:white;padding:35px}
h1{font-size:46px;margin-bottom:8px}
.sub{color:#94a3b8;margin-bottom:25px}

form,.card,.stat-card{
  background:#0f172a;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:20px;
}

form{display:grid;gap:12px;margin-bottom:25px}

input{
  padding:15px;
  border:0;
  border-radius:14px;
  background:#1e293b;
  color:white;
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.btn-cadastrar{background:#22c55e}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.stat-card span{color:#94a3b8;font-size:13px}
.stat-card strong{display:block;font-size:28px;margin-top:5px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(12px);
}

.card.top{
  background:linear-gradient(135deg,#0f172a,#064e3b);
}

.badge{
  position:absolute;
  right:18px;
  top:18px;
  background:rgba(34,197,94,.2);
  color:#86efac;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
}

.icon{font-size:28px;margin-bottom:15px}
.card h2{font-size:30px;margin-bottom:10px}
.card p{color:#cbd5e1;margin-bottom:6px}

.progresso{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  margin:15px 0;
}

.barra{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
}

.tags{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tag{background:rgba(255,255,255,.1);padding:7px 10px;border-radius:10px;font-size:12px}

.print-box{margin-top:15px}
.print-box span{display:block;color:#94a3b8;font-size:13px;margin-bottom:8px}

.print-img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);
  margin-top:10px;
  transition:.35s;
  cursor:pointer;
}

.print-img:hover{
  transform:scale(1.02);
  box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.sem-print{
  margin-top:15px;
  color:#94a3b8;
  font-size:13px;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.green{background:#22c55e}
.yellow{background:#eab308}
.red{background:#fb7185}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:9999;
  justify-content:center;
  align-items:center;
  padding:40px;
  backdrop-filter:blur(8px);
}

.modal img{
  width:auto;
  max-width:95vw;
  max-height:92vh;
  border-radius:22px;
  object-fit:contain;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
  animation:zoom .25s ease;
}

.fechar-modal{
  position:absolute;
  top:25px;
  right:35px;
  color:white;
  font-size:42px;
  cursor:pointer;
  z-index:10000;
}

@keyframes zoom{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

@media(max-width:768px){
  body{padding:20px}
  h1{font-size:34px}
}
</style>
</head>

<body>

<h1>Painel de Promoters</h1>
<p class="sub">Ranking conectado ao Supabase com prints, posts e metas.</p>

<form id="form-promoter">
  <input type="text" id="nome" placeholder="Nome do promoter" required>
  <input type="text" id="instagram" placeholder="@instagram">
  <input type="text" id="telefone" placeholder="Telefone">
  <input type="file" id="print" accept="image/*">
  <button class="btn-cadastrar" type="submit">Cadastrar promoter</button>
</form>

<div class="stats" id="stats"></div>
<div class="grid" id="lista-promoters"></div>

<div id="modal" class="modal">
  <span class="fechar-modal">&times;</span>
  <img id="imagem-modal">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<script>
async function carregarPromoters(){
  const { data, error } = await db
    .from("promoters")
    .select("*")
    .order("posts_feitos", { ascending:false })

  if(error){
    console.log(error)
    alert("Erro ao carregar promoters")
    return
  }

  const lista = document.getElementById("lista-promoters")
  lista.innerHTML = ""

  const totalPromoters = data.length
  const totalPosts = data.reduce((soma,p) => soma + (p.posts_feitos || 0), 0)
  const melhorPromoter = data[0]?.nome || "-"
  const media = totalPromoters > 0 ? Math.floor(totalPosts / totalPromoters) : 0

  document.getElementById("stats").innerHTML = `
    <div class="stat-card"><span>Total de promoters</span><strong>${totalPromoters}</strong></div>
    <div class="stat-card"><span>Total de posts</span><strong>${totalPosts}</strong></div>
    <div class="stat-card"><span>Melhor promoter</span><strong>${melhorPromoter}</strong></div>
    <div class="stat-card"><span>Média de posts</span><strong>${media}</strong></div>
  `

  data.forEach((promoter,index) => {
    const percentual = Math.floor(((promoter.posts_feitos || 0) / (promoter.meta_posts || 10)) * 100) || 0
    const medalha = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🎯"
    const status = percentual >= 100 ? "VIP" : percentual >= 70 ? "Camarote" : "Pista"

    lista.innerHTML += `
      <div class="card ${index === 0 ? "top" : ""}">
        <div class="badge">${status}</div>
        <div class="icon">${medalha}</div>

        <h2>${promoter.nome}</h2>
        <p>Instagram: ${promoter.instagram || "-"}</p>
        <p>Telefone: ${promoter.telefone || "-"}</p>
        <p>Posts: ${promoter.posts_feitos || 0}</p>
        <p>Meta: ${promoter.meta_posts || 10}</p>

        <div class="progresso">
          <div class="barra" style="width:${percentual}%"></div>
        </div>

        <div class="tags">
          <div class="tag">#${percentual}%</div>
          <div class="tag">#ranking ${index + 1}</div>
          <div class="tag">#promoter</div>
        </div>

        ${
          promoter.print_url
            ? `
              <div class="print-box">
                <span>Print enviado</span>
                <img class="print-img" src="${promoter.print_url}" onclick="abrirModal('${promoter.print_url}')">
              </div>
            `
            : `
              <div class="sem-print">Nenhum print enviado</div>
            `
        }

        <div class="actions">
          <button class="green" onclick="somarPost('${promoter.id}', ${promoter.posts_feitos || 0})">+1 post</button>
          <button class="yellow" onclick="diminuirPost('${promoter.id}', ${promoter.posts_feitos || 0})">-1 post</button>
          <button class="red" onclick="excluir('${promoter.id}')">Excluir</button>
        </div>
      </div>
    `
  })
}

async function somarPost(id, atual){
  await db.from("promoters").update({ posts_feitos: atual + 1 }).eq("id", id)
  carregarPromoters()
}

async function diminuirPost(id, atual){
  const novoValor = atual > 0 ? atual - 1 : 0
  await db.from("promoters").update({ posts_feitos: novoValor }).eq("id", id)
  carregarPromoters()
}

async function excluir(id){
  const confirmar = confirm("Deseja excluir esse promoter?")
  if(!confirmar) return

  await db.from("promoters").delete().eq("id", id)
  carregarPromoters()
}

document.getElementById("form-promoter").addEventListener("submit", async (e) => {
  e.preventDefault()

  const nome = document.getElementById("nome").value
  const instagram = document.getElementById("instagram").value
  const telefone = document.getElementById("telefone").value
  const arquivo = document.getElementById("print").files[0]

  let urlPrint = ""

  if(arquivo){
    const nomeArquivo = Date.now() + "-" + arquivo.name

    const { error: uploadError } = await db.storage
      .from("prints")
      .upload(nomeArquivo, arquivo)

    if(uploadError){
      alert("Erro ao enviar print")
      console.log(uploadError)
      return
    }

    const { data } = db.storage
      .from("prints")
      .getPublicUrl(nomeArquivo)

    urlPrint = data.publicUrl
  }

  const { error } = await db
    .from("promoters")
    .insert([{
      nome,
      instagram,
      telefone,
      print_url: urlPrint
    }])

  if(error){
    alert("Erro ao cadastrar")
    console.log(error)
    return
  }

  document.getElementById("form-promoter").reset()
  carregarPromoters()
})

function abrirModal(url){
  const modal = document.getElementById("modal")
  const imagem = document.getElementById("imagem-modal")

  imagem.src = url
  modal.style.display = "flex"
}

document.querySelector(".fechar-modal").onclick = () => {
  document.getElementById("modal").style.display = "none"
}

document.getElementById("modal").onclick = (e) => {
  if(e.target.id === "modal"){
    document.getElementById("modal").style.display = "none"
  }
}

carregarPromoters()
</script>

</body>
</html>
