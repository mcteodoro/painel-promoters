<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Promoters</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#071226;
color:white;
padding:30px;
}

h1{
font-size:52px;
margin-bottom:10px;
}

.sub{
opacity:.7;
margin-bottom:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#0f1d35;
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.05);
}

input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:12px;
margin-bottom:15px;
background:#162847;
color:white;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#28f0d0;
font-weight:bold;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:30px;
}

.promoter{
background:#0f1d35;
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,.05);
}

.promoter img{
width:100%;
height:220px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
margin-bottom:30px;
}

.stat{
background:#0f1d35;
padding:20px;
border-radius:20px;
}

.login-box{
max-width:400px;
margin:100px auto;
background:#0f1d35;
padding:30px;
border-radius:20px;
}

.logout{
margin-bottom:20px;
width:150px;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

const SUPABASE_URL = "https://xbteuroldclsiaskqokb.supabase.co"

const SUPABASE_KEY ="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhidGV1cm9sZGNsc2lhc2txb2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Mjc3NjEsImV4cCI6MjA5NTAwMzc2MX0.qNvengehWRZMAXT7hGadtwDiANO8FUMYyXs0_Lq2Mtw"

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

const app = document.getElementById("app")

function telaLogin(){
app.innerHTML = `
<div class="login-box">

<h1 style="font-size:40px;">Login Promoter</h1>

<form id="form-login">

<input
type="email"
id="login-email"
placeholder="E-mail"
required
/>

<input
type="password"
id="login-senha"
placeholder="Senha"
required
/>

<button type="submit">
Entrar
</button>

</form>

</div>
`

document
.getElementById("form-login")
.addEventListener("submit", loginPromoter)
}

async function loginPromoter(e){

e.preventDefault()

const email =
document.getElementById("login-email").value

const senha =
document.getElementById("login-senha").value

const { data, error } =
await db.auth.signInWithPassword({
email,
password: senha
})

if(error){
alert("Login inválido")
console.log(error)
return
}

localStorage.setItem(
"user",
JSON.stringify(data.user)
)

carregarPainel()
}

function logout(){
localStorage.removeItem("user")
location.reload()
}

async function carregarPainel(){

const { data } =
await db
.from("promoters")
.select("*")
.order("posts_feitos", {
ascending:false
})

const totalPromoters = data.length

const totalPosts =
data.reduce((soma,p) =>
soma + p.posts_feitos,0)

const melhor =
data[0]?.nome || "-"

const media =
totalPromoters > 0
? Math.floor(totalPosts / totalPromoters)
: 0

app.innerHTML = `

<button class="logout" onclick="logout()">
Sair
</button>

<h1>Painel de Promoters</h1>

<p class="sub">
Ranking conectado ao Supabase com prints, posts e metas.
</p>

<div class="card">

<form id="form-promoter">

<input
type="text"
id="nome"
placeholder="Nome do promoter"
required
/>

<input
type="text"
id="instagram"
placeholder="@instagram"
required
/>

<input
type="text"
id="telefone"
placeholder="Telefone"
required
/>

<input
type="file"
id="print"
accept="image/*"
/>

<button type="submit">
Cadastrar promoter
</button>

</form>

</div>

<div class="stats">

<div class="stat">
<h3>Total de promoters</h3>
<h2>${totalPromoters}</h2>
</div>

<div class="stat">
<h3>Total de posts</h3>
<h2>${totalPosts}</h2>
</div>

<div class="stat">
<h3>Melhor promoter</h3>
<h2>${melhor}</h2>
</div>

<div class="stat">
<h3>Média de posts</h3>
<h2>${media}</h2>
</div>

</div>

<div class="grid">

${data.map((p,index)=>`

<div class="promoter">

<h2>${p.nome}</h2>

<p>
Instagram: ${p.instagram}
</p>

<p>
Telefone: ${p.telefone}
</p>

<p>
Posts: ${p.posts_feitos}
</p>

<p>
Meta: ${p.meta_posts}
</p>

${p.print_url ? `
<img src="${p.print_url}">
` : ""}

<br><br>

<button onclick="somarPost('${p.id}')">
+1 post
</button>

</div>

`).join("")}

</div>
`

document
.getElementById("form-promoter")
.addEventListener("submit", cadastrarPromoter)
}

async function cadastrarPromoter(e){

e.preventDefault()

const nome =
document.getElementById("nome").value

const instagram =
document.getElementById("instagram").value

const telefone =
document.getElementById("telefone").value

const arquivo =
document.getElementById("print").files[0]

let urlPrint = null

if(arquivo){

const nomeArquivo =
Date.now() + "-" + arquivo.name

const { error: uploadError } =
await db.storage
.from("prints")
.upload(nomeArquivo, arquivo)

if(!uploadError){

const { data } =
db.storage
.from("prints")
.getPublicUrl(nomeArquivo)

urlPrint = data.publicUrl

}

}

await db
.from("promoters")
.insert([{
nome,
instagram,
telefone,
posts_feitos:0,
meta_posts:10,
print_url:urlPrint
}])

carregarPainel()
}

async function somarPost(id){

const { data } =
await db
.from("promoters")
.select("*")
.eq("id", id)
.single()

await db
.from("promoters")
.update({
posts_feitos:
data.posts_feitos + 1
})
.eq("id", id)

carregarPainel()
}

const user =
localStorage.getItem("user")

if(user){
carregarPainel()
}else{
telaLogin()
}

</script>

</body>
</html>
